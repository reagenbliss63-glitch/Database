name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Code to EC2 Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Deployment Pipeline Triggered..."
            
            # 1. Pull the latest code
            cd ~/Database
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Update Backend
            cd backend
            npm install --production
            sudo rsync -av --exclude 'node_modules' ./ /var/www/backend/
            cd /var/www/backend
            npm install --production
            pm2 restart backend || pm2 start index.js --name backend
            
            # 3. Update Frontend
            cd ~/Database/frontend
            npm install
            npm run build
            
            # Verify build folder exists
            if [ -d "build" ]; then
                echo "Build successful. Copying files..."
                sudo rm -rf /var/www/frontend/*
                sudo cp -r build/* /var/www/frontend/
                echo "Frontend Updated! ✓"
            else
                echo "ERROR: Build folder not found! Checking for dist..."
                if [ -d "dist" ]; then
                    sudo rm -rf /var/www/frontend/*
                    sudo cp -r dist/* /var/www/frontend/
                    echo "Frontend Updated (using dist)! ✓"
                else
                    echo "CRITICAL ERROR: No build or dist folder found."
                    exit 1
                fi
            fi
            
            echo "Deployment finished successfully! 🚀"
