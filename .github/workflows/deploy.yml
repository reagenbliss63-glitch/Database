name: Deploy to EC2

# This tells GitHub to run this script every time you push to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Code to EC2 Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Starting deployment..."
            
            # 1. Pull the latest code from GitHub
            cd ~/Database
            git pull origin main
            
            # 2. Update the Backend (Node.js)
            cd backend
            npm install
            # Copy the fresh code to the Nginx serving directory and restart PM2
            sudo rsync -av --exclude 'node_modules' ./ /var/www/backend/
            cd /var/www/backend
            npm install
            pm2 restart backend
            
            # 3. Update the Frontend (React)
            cd ~/Database/frontend
            npm install
            npm run build
            # Copy the compiled static files to Nginx
            sudo cp -r build/* /var/www/frontend/
            
            echo "Deployment successful! ✓"
